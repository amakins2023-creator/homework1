<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Doctor Appointment</title>
</head>
<body>
   <h1>My Doctor Appointment.</h1> 
   <p>You must fill in the form below to book your health checkup/your Doctor's appointment.</p>
   <form>
    <fieldset>
        <legend>Personal and confiental Details</legend>

        <label>Your Name</label><hr>
        <input type="text" id="name" placeholder="Enter Your full name"><br><br>

        <label>Patient ID</label><hr>
        <input type="password" id="pid" placeholder="Enter Patient ID"><br><br>

        <label>Date of Birth</label><hr>
        <input type="date" id="dob"><br>
    </fieldset><br><br>



    <br>

    <fieldset>
        <legend>Your Visit</legend>

        <label>Choose Your doctor</label><hr>
        <select id="doctor">
        <option value="">-- Select Doctor --</option>
        <option value="dr-ray">Dr. Ray - General</option>
        <option value="dr-dave">Dr. Dave - Diet an Teeth</option>
        <option value="dr-sam">Dr. Sam - Eyes</option>
        </select><br><br>
    </fieldset>
   </form>
</body>
</html>
